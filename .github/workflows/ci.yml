name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: merc32-vsce
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: merc32-vsce/package-lock.json

      - name: Install RTL test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iverilog

      - name: Install dependencies
        run: npm ci

      - name: Verify vendored compiler
        run: npm run test:c:aro-vendor

      - name: Run compiler tests
        run: npm test

      - name: Run CPU RTL regression
        run: npm run test:cpu

      - name: Run SoC configuration tests
        run: npm run test:soc:config

      - name: Run SoC WebView interaction tests
        run: npm run test:soc:webview:dom

      - name: Run SoC WebView geometry tests
        run: node scripts/test-soc-webview-geometry.js
        env:
          MERC32_BROWSER_PATH: /usr/bin/google-chrome

      - name: Run SoC generator tests
        run: node scripts/test-soc-generator.js

      - name: Run SoC driver tests
        run: node scripts/test-soc-drivers.js

      - name: Run SoC RTL tests
        run: node scripts/test-soc-rtl.js

      - name: Verify VSIX runtime dependencies
        run: npm run test:vsix:deps

      - name: Run extension host tests
        run: xvfb-run --auto-servernum npm run test:extension

      - name: Verify installed smoke guards
        run: npm run test:smoke-extension:unit

      - name: Package VSIX
        run: npm run package:vsix

      - name: Smoke test VSIX
        run: xvfb-run --auto-servernum npm run test:vsix
